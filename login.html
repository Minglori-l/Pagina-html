<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chase Atlantic Fan Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="body-login">

    <!-- Encabezado Principal -->
    <header>
        <h1 class="logo"><a href="index.html" style="color: white; text-decoration: none;">Fandom wiki</a></h1>
        
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html#Run">Carrera</a></li>
                <li><a href="index.html#Integrantes">Integrantes</a></li>
                <li><a href="index.html#Discos">Discografía</a></li>
                <li><a href="index.html#Concert">Conciertos</a></li>
                <li><a href="login.html" style="color: #e056fd;">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Pantalla Completa -->
    <main class="contenedor-login-pantalla-completa">
        <div class="caja-login-glass">
            <h2 class="titulo-login">FAN CLUB OFICIAL</h2>

            <form id="form-login" onsubmit="event.preventDefault();">
                <div class="campo-login">
                    <label for="usuario">USER NAME</label>
                    <input type="text" id="usuario" placeholder="INGRESA TU USUARIO" required>
                </div>

                <div class="campo-login">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" placeholder="INGRESA TU CONTRASEÑA" required>
                </div>

                <button type="submit" class="btn-login-submit">INICIA SESIÓN</button>

                <button type="button" class="btn-login-google">
                    <svg class="icono-google" viewBox="0 0 24 24" width="16" height="16">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    INICIA SESION CON GOOGLE
                </button>

                <div class="pie-login">
                    <a href="#" class="link-olvido">¿OLVIDASTE TU CONTRASEÑA?</a>
                    <a href="#" class="link-registro">REGÍSTRATE</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
